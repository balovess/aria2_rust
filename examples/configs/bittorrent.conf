# aria2-rust BitTorrent Configuration Template
# 
# Optimized for BitTorrent downloads.
# Copy this file to ~/.aria2/aria2.conf and modify as needed.

# ============================================
# Basic Options
# ============================================
dir=~/downloads/bittorrent
continue=true
max-concurrent-downloads=3

# ============================================
# Connection Options
# ============================================
max-connection-per-server=4
split=4
timeout=120

# ============================================
# BitTorrent Options
# ============================================

# Enable DHT (Distributed Hash Table)
enable-dht=true

# DHT listen port
dht-listen-port=6881

# DHT entry point (bootstrap nodes)
# dht-entry-point=router.bittorrent.com:6881

# Enable peer exchange (PEX)
enable-peer-exchange=true

# Enable public tracker list
enable-public-trackers=true

# Maximum peers per torrent
bt-max-peers=100

# Maximum upload slots
bt-max-upload-slots=4

# Require encryption (MSE/PE)
bt-require-crypto=false

# Force encryption
bt-force-encrypt=false

# Piece selection strategy: rarest-first, sequential, random
bt-piece-selection-strategy=rarest-first

# ============================================
# Seeding Options
# ============================================

# Seed ratio (1.0 = seed until uploaded 1x download size)
seed-ratio=1.0

# Seed time in minutes (60 = 1 hour)
seed-time=60

# ============================================
# Tracker Options
# ============================================

# Tracker connect timeout
bt-tracker-connect-timeout=60

# Tracker interval
bt-tracker-interval=1800

# ============================================
# File Options
# ============================================
file-allocation=prealloc
auto-save-interval=30

# ============================================
# Session Management
# ============================================

# DHT data file (persist DHT routing table)
# dht-file-path=~/.aria2/dht.dat

# Session file
# input-file=~/.aria2/bt-session.txt
# save-session=~/.aria2/bt-session.txt
save-session-interval=30

# ============================================
# Logging
# ============================================
log-level=info
# log=~/.aria2/bt.log
