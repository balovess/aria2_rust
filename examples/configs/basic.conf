# aria2-rust Basic Configuration Template
# 
# This is a basic configuration file for aria2-rust.
# Copy this file to ~/.aria2/aria2.conf and modify as needed.
#
# Usage: aria2c --conf-path=/path/to/aria2.conf

# ============================================
# Basic Options
# ============================================

# Directory to save downloaded files
dir=~/downloads

# Continue downloading a partially downloaded file
continue=true

# Maximum number of concurrent downloads
max-concurrent-downloads=5

# ============================================
# Connection Options
# ============================================

# Maximum number of connections to one server per download
max-connection-per-server=4

# Split download file into N pieces
split=4

# Minimum size of a split piece (1M = 1 megabyte)
min-split-size=1M

# Timeout in seconds
timeout=60

# ============================================
# File Options
# ============================================

# File allocation method: none, prealloc, trunc, falloc
file-allocation=prealloc

# Auto save download progress every N seconds
auto-save-interval=60

# Save download session on exit
# save-session=~/.aria2/session.txt

# ============================================
# Logging
# ============================================

# Log level: debug, info, notice, warn, error
log-level=warn

# Log file (optional)
# log=~/.aria2/aria2.log
