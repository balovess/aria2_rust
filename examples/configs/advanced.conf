# aria2-rust Advanced Configuration Template
# 
# This configuration includes RPC server, proxy, and advanced settings.
# Copy this file to ~/.aria2/aria2.conf and modify as needed.

# ============================================
# Basic Options
# ============================================
dir=~/downloads
continue=true
max-concurrent-downloads=5

# ============================================
# Connection Options
# ============================================
max-connection-per-server=16
split=16
min-split-size=1M
timeout=60
connect-timeout=10

# Retry settings
max-tries=5
retry-wait=10

# ============================================
# RPC Server Options
# ============================================

# Enable RPC server
enable-rpc=true

# Listen on all network interfaces
rpc-listen-all=true

# RPC port
rpc-listen-port=6800

# Allow all origins for CORS
rpc-allow-origin-all=true

# RPC secret token (IMPORTANT: Change this!)
# rpc-secret=YOUR_SECRET_TOKEN_HERE

# Maximum request body size (for large batch downloads)
rpc-max-request-body-size=10M

# ============================================
# Proxy Settings (Optional)
# ============================================

# HTTP proxy
# http-proxy=http://proxy.example.com:8080

# HTTPS proxy
# https-proxy=http://proxy.example.com:8080

# FTP proxy
# ftp-proxy=http://proxy.example.com:8080

# All proxy (applies to all protocols)
# all-proxy=http://proxy.example.com:8080

# No proxy for these hosts
# no-proxy=localhost,127.0.0.1,192.168.0.0/16

# ============================================
# SSL/TLS Options
# ============================================

# Check SSL/TLS certificates
check-certificate=true

# CA certificate file (optional)
# ca-certificate=/etc/ssl/certs/ca-certificates.crt

# ============================================
# HTTP Options
# ============================================

# User agent
user-agent=aria2-rust/0.3.1

# Enable HTTP keep-alive
enable-http-keep-alive=true

# Enable HTTP pipelining
enable-http-pipelining=false

# ============================================
# File Options
# ============================================
file-allocation=prealloc
auto-save-interval=60

# Allow overwrite existing file
allow-overwrite=false

# Auto rename file if it already exists
auto-file-renaming=true

# ============================================
# BitTorrent Options
# ============================================

# Enable DHT
enable-dht=true

# DHT listen port
dht-listen-port=6881

# Enable peer exchange
enable-peer-exchange=true

# Maximum peers per torrent
bt-max-peers=55

# Seed ratio (0 = seed forever)
seed-ratio=1.0

# Seed time in minutes (0 = no time limit)
seed-time=0

# ============================================
# Session Management
# ============================================

# Input file (load session on startup)
# input-file=~/.aria2/session.txt

# Save session file
# save-session=~/.aria2/session.txt

# Save session interval in seconds
save-session-interval=60

# ============================================
# Logging
# ============================================
log-level=info
# log=~/.aria2/aria2.log

# ============================================
# Advanced Options
# ============================================

# Disk cache size
disk-cache=16M

# Piece length for BitTorrent (0 = auto)
piece-length=0

# Download speed limit (0 = unlimited)
max-download-limit=0

# Upload speed limit (0 = unlimited)
max-upload-limit=0

# Overall download speed limit (0 = unlimited)
max-overall-download-limit=0

# Overall upload speed limit (0 = unlimited)
max-overall-upload-limit=0
