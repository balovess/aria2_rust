# Windows configuration for aria2-rust

bt-enable-lpd=true
bt-force-encryption=true
bt-request-peer-speed-limit=500K

check-certificate=true
content-disposition-default-utf8=true
continue=true
console-log-level=error
daemon=true

dir=downloads
disk-cache=512M
dht-file-path=dht.dat
dht-file-path6=dht6.dat

enable-dht=true
enable-dht6=true
enable-rpc=true
file-allocation=falloc
follow-metalink=mem
follow-torrent=mem
http-accept-gzip=true

input-file=aria2.session
log=aria2.log
log-level=error
max-concurrent-downloads=3
max-connection-per-server=4
max-overall-download-limit=0
metalink-location=id,sg,jp
metalink-preferred-protocol=https
min-split-size=1M
no-netrc=true

peer-agent=Mozilla/5.0
peer-id-prefix=MZ-5-0-0-
pid-file=aria2.pid
quiet=true
remote-time=true

rpc-allow-origin-all=true
rpc-save-upload-metadata=false
save-session=aria2.session
save-session-interval=60
seed-ratio=0.1
seed-time=0
show-console-readout=false

user-agent=Mozilla/5.0

# Unsupported by aria2-rust 0.3.4:
# optimize-concurrent-downloads=true
# socket-recv-buffer-size=64K
