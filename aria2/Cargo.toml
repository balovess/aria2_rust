[package]
name = "aria2"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "aria2c"
path = "src/main.rs"

[[test]]
name = "test_rpc_api_compatibility"
path = "tests/regression/test_rpc_api_compatibility.rs"

[[test]]
name = "test_cli_options"
path = "tests/regression/test_cli_options.rs"

[[test]]
name = "test_config_file"
path = "tests/regression/test_config_file.rs"

[dependencies]
aria2-core = { path = "../aria2-core" }
aria2-protocol = { path = "../aria2-protocol" }
aria2-rpc = { path = "../aria2-rpc" }

tokio.workspace = true
tracing.workspace = true
colored = "2.0"
serde_json.workspace = true
thiserror.workspace = true
clap = { version = "4.5", features = ["derive", "color", "wrap_help", "env"] }
clap_complete = "4.5"

# Unix-specific dependencies for daemon mode
[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"
base64 = "0.22"

[features]
default = ["http", "bittorrent", "rpc"]
http = ["aria2-protocol/http"]
bittorrent = ["aria2-protocol/bittorrent"]
metalink = ["aria2-protocol/metalink"]
rpc = []
sftp = ["aria2-protocol/sftp"]
