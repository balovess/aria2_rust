[package]
name = "aria2"
version = "0.3.6"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "aria2c"
path = "src/main.rs"

[[test]]
name = "test_rpc_api_compatibility"
path = "tests/regression/test_rpc_api_compatibility.rs"

[[test]]
name = "test_cli_options"
path = "tests/regression/test_cli_options.rs"

[[test]]
name = "test_config_file"
path = "tests/regression/test_config_file.rs"

[[test]]
name = "test_rpc_notifications"
path = "tests/regression/test_rpc_notifications.rs"

[dependencies]
aria2-core.workspace = true
aria2-protocol.workspace = true
aria2-rpc.workspace = true

tokio.workspace = true
tracing.workspace = true
colored = "2.0"
serde_json.workspace = true
async-trait.workspace = true
thiserror.workspace = true
base64.workspace = true
clap = { version = "4.5", features = ["derive", "color", "wrap_help", "env"] }
clap_complete = "4.5"
crossterm = "0.27"
ratatui = "0.29"
reqwest = { workspace = true, features = ["json"] }
mimalloc = { version = "0.1", optional = true }

# Unix-specific dependencies for daemon mode
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
futures.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true

[features]
default = ["http", "bittorrent", "rpc"]
http = ["aria2-protocol/http"]
bittorrent = ["aria2-protocol/bittorrent", "aria2-core/bittorrent", "aria2-rpc/bittorrent"]
metalink = ["aria2-protocol/metalink", "aria2-core/metalink", "aria2-rpc/metalink"]
rpc = []
mimalloc = ["dep:mimalloc"]
sftp = ["aria2-protocol/sftp", "aria2-core/sftp", "aria2-rpc/sftp"]
