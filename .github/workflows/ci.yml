name: CI

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  feature-matrix:
    name: Feature build (${{ matrix.name }})
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimal
            features: http
          - name: standard
            features: standard
          - name: tui
            features: tui
          - name: full
            features: full
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: feature-${{ matrix.name }}
      - name: Check feature build
        run: cargo check --package aria2 --no-default-features --features "${{ matrix.features }}"

  # ── Lint & format (fast, single platform) ─────────────────
  lint:
    name: Lint & Format
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy check
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format check
        run: cargo fmt --all -- --check

  # ── Library and integration test verification ─────────────
  test:
    name: Test (${{ matrix.os }})
    if: github.ref != 'refs/heads/master'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - os: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
          - os: x86_64-pc-windows-msvc
            runner: windows-latest
          - os: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os }}
      - name: Install Linux ARM64 cross compiler
        if: matrix.os == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu
      - name: Configure Linux ARM64 linker
        if: matrix.os == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          mkdir -p "$HOME/.cargo"
          cat >> "$HOME/.cargo/config.toml" <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}
      - name: Run tests
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "aarch64-unknown-linux-gnu" ]; then
            cargo check --workspace --all-targets --target "${{ matrix.os }}"
          else
            cargo test --workspace -j 1 --lib --tests -- --test-threads=1
          fi
