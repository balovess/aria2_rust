name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run all tests
        run: cargo test --workspace --all-targets

      - name: Check benchmarks compile
        run: cargo check --benches

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run benchmarks
        run: |
          cargo bench --bench config_bench -- --nocapture 2>&1 | tee config_bench.txt || true
          cargo bench --bench p2_bench -- --nocapture 2>&1 | tee p2_bench.txt || true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: '*.txt'
          retention-days: 90

  python-test:
    name: Python SDK Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          cd bindings/python
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          cd bindings/python
          pytest tests/ -v --cov=aria2_rust_client

  nodejs-test:
    name: Node.js SDK Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd bindings/nodejs
          npm install

      - name: Run tests
        run: |
          cd bindings/nodejs
          npm test

      - name: Build
        run: |
          cd bindings/nodejs
          npm run build

  doc-check:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Generate documentation
        run: cargo doc --workspace --document-private-items

      - name: Run documentation tests
        run: cargo test --doc --workspace

  msrv-check:
    name: MSRV Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'

      - uses: Swatinem/rust-cache@v2

      - name: Check compilation with MSRV
        run: cargo check --workspace --all-targets

  version-check:
    name: Version Consistency Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check version consistency
        run: |
          # Get version from Cargo.toml
          CARGO_VERSION=$(grep -oP 'version\s*=\s*"\K[^"]+' Cargo.toml | head -1)
          echo "Cargo.toml version: $CARGO_VERSION"

          # Check Homebrew formula
          HOMEBREW_VERSION=$(grep -oP 'version "\K[^"]+' homebrew/aria2-rust.rb)
          echo "Homebrew version: $HOMEBREW_VERSION"
          if [ "$CARGO_VERSION" != "$HOMEBREW_VERSION" ]; then
            echo "ERROR: Homebrew version mismatch!"
            exit 1
          fi

          # Check Scoop manifest
          SCOOP_VERSION=$(grep -oP '"version": "\K[^"]+' scoop/aria2-rust.json)
          echo "Scoop version: $SCOOP_VERSION"
          if [ "$CARGO_VERSION" != "$SCOOP_VERSION" ]; then
            echo "ERROR: Scoop version mismatch!"
            exit 1
          fi

          echo "Binary distribution versions are consistent: $CARGO_VERSION"
