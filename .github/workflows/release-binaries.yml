name: Release Binaries

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: binary-release-master
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare binary release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Unable to determine the workspace version" >&2
            exit 1
          fi

          PYTHON_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' bindings/python/pyproject.toml | head -n 1)
          NODE_VERSION=$(node -p "require('./bindings/nodejs/package.json').version")
          if [ "$PYTHON_VERSION" != "$VERSION" ] || [ "$NODE_VERSION" != "$VERSION" ]; then
            echo "All published package versions must match $VERSION" >&2
            echo "Python: $PYTHON_VERSION; Node.js: $NODE_VERSION" >&2
            exit 1
          fi

          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "$TAG already exists; no release is needed."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: aria2-x86_64-linux
            extension: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: aria2-x86_64-windows
            extension: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: aria2-aarch64-macos
            extension: ''
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: aria2-x86_64-macos
            extension: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --package aria2 --target ${{ matrix.target }}
      - name: Package artifact (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz aria2c${{ matrix.extension }}
      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.artifact }}.zip aria2c${{ matrix.extension }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
          if-no-files-found: error

  publish-crates:
    name: Publish crates.io packages
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-crates
      - name: Publish crates.io packages
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "CARGO_REGISTRY_TOKEN is not configured" >&2; exit 1; }
          cargo publish --dry-run -p aria2-protocol
          cargo publish --dry-run -p aria2-core
          cargo publish --dry-run -p aria2-rpc
          cargo publish -p aria2-protocol --token "$CARGO_REGISTRY_TOKEN"
          sleep 30
          cargo publish -p aria2-core --token "$CARGO_REGISTRY_TOKEN"
          sleep 30
          cargo publish -p aria2-rpc --token "$CARGO_REGISTRY_TOKEN"

  publish-python:
    name: Publish Python SDK
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Build and publish Python SDK
        shell: bash
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TWINE_PASSWORD" || { echo "PYPI_TOKEN is not configured" >&2; exit 1; }
          cd bindings/python
          python -m pip install --upgrade build twine
          python -m build
          twine upload dist/*

  publish-nodejs:
    name: Publish Node.js SDK
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: https://registry.npmjs.org
      - name: Build and publish Node.js SDK
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN" || { echo "NPM_TOKEN is not configured" >&2; exit 1; }
          cd bindings/nodejs
          npm ci
          npm run build
          npm publish --access public

  github-release:
    name: Create GitHub Release
    needs: [prepare, build, publish-crates, publish-python, publish-nodejs]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log "$PREVIOUS_TAG"..HEAD --pretty=format:'- %s (%h)' --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:'- %s (%h)' --no-merges -20)
          fi
          {
            echo 'changelog<<EOF'
            echo "$CHANGELOG"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: aria2 ${{ needs.prepare.outputs.version }}
          body: |
            ## Changes
            ${{ steps.changelog.outputs.changelog }}
          files: artifacts/*/*
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
