name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      
      - uses: Swatinem/rust-cache@v2
      
      - name: Dry-run validation
        run: cargo publish --dry-run -p aria2-protocol

      - name: Publish aria2-protocol
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        run: cargo publish -p aria2-protocol --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crate to be available
        if: startsWith(github.ref, 'refs/tags/')
        run: sleep 30

      - name: Publish aria2-core
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        run: cargo publish -p aria2-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crate to be available
        if: startsWith(github.ref, 'refs/tags/')
        run: sleep 30

      - name: Publish aria2-rpc
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        run: cargo publish -p aria2-rpc --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Verify publications
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          for crate in aria2-protocol aria2-core aria2-rpc; do
            # Read the expected version from the crate's own Cargo.toml
            expected=$(grep -oP '^version\s*=\s*"\K[^"]+' "$crate/Cargo.toml")
            # Retry up to 3 times — crates.io may need a few seconds to index
            version=""
            for attempt in 1 2 3; do
              version=$(curl -sSf -A "aria2-rust-release-pipeline" "https://crates.io/api/v1/crates/$crate" | grep -o '"max_version":"[^"]*"' | cut -d'"' -f4)
              if [ -n "$version" ]; then break; fi
              echo "Attempt $attempt: $crate not yet indexed, retrying in 10s..."
              sleep 10
            done
            echo "$crate expected=$expected, published=$version"
            if [ "$version" != "$expected" ]; then
              echo "ERROR: $crate version mismatch: expected $expected, got $version"
              exit 1
            fi
            sleep 2
          done
          echo "All crates verified"
