name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Branch guard: only master branch can publish ────────────
  check-branch:
    name: Check tag is on master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag is on master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/master; then
            echo "ERROR: Tag must be on master branch"
            exit 1
          fi
          echo "Tag is on master, proceeding..."

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [check-branch]
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      
      - uses: Swatinem/rust-cache@v2
      
      - name: Dry-run validation
        run: cargo publish --dry-run -p aria2-protocol

      - name: Publish aria2-protocol
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        run: cargo publish -p aria2-protocol --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crate to be available
        if: startsWith(github.ref, 'refs/tags/')
        run: sleep 30

      - name: Publish aria2-core
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        run: cargo publish -p aria2-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crate to be available
        if: startsWith(github.ref, 'refs/tags/')
        run: sleep 30

      - name: Publish aria2-rpc
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        run: cargo publish -p aria2-rpc --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Verify publications
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          EXPECTED_VERSION=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "Expected version: $EXPECTED_VERSION"
          for crate in aria2-protocol aria2-core aria2-rpc; do
            version=""
            for attempt in 1 2 3; do
              version=$(curl -sSf -A "aria2-rust-release-pipeline" "https://crates.io/api/v1/crates/$crate" | grep -o '"max_version":"[^"]*"' | cut -d'"' -f4)
              if [ -n "$version" ]; then break; fi
              echo "Attempt $attempt: $crate not yet indexed, retrying in 10s..."
              sleep 10
            done
            echo "$crate max_version: $version"
            if [ "$version" != "$EXPECTED_VERSION" ]; then
              echo "ERROR: $crate is at $version, expected $EXPECTED_VERSION"
              exit 1
            fi
            sleep 2
          done
          echo "All crates verified at version $EXPECTED_VERSION"
