name: Update Scoop manifest

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to validate, for example v0.3.2
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: scoop-manifest
  cancel-in-progress: false

jobs:
  update:
    name: Update Scoop manifest
    if: ${{ github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Update and validate manifest
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          ./scripts/update-scoop.ps1 -Version $env:RELEASE_TAG -Repository $env:REPOSITORY
          ./scripts/update-scoop.ps1 -Check
      - name: Commit manifest update
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scoop/aria2-rust.json
          if (git diff --cached --quiet) {
            Write-Host "Scoop manifest is already up to date."
            exit 0
          }
          git commit -m "chore: update Scoop manifest for $env:RELEASE_TAG"
          git push origin "HEAD:$env:DEFAULT_BRANCH"
