name: Update Scoop manifest

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: package-manifests
  cancel-in-progress: false

jobs:
  update:
    name: Update Scoop manifest
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Update and validate manifest
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          ./scripts/update-scoop.ps1 -Version $env:RELEASE_TAG -Repository $env:REPOSITORY
          ./scripts/update-scoop.ps1 -Check
      - name: Verify packaged aria2c entry point
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $manifest = Get-Content -Raw scoop/aria2-rust.json | ConvertFrom-Json
          $tempRoot = Join-Path ([System.IO.Path]::GetTempPath()) ("aria2-scoop-smoke-" + [guid]::NewGuid().ToString("N"))
          $archive = Join-Path $tempRoot 'aria2-rust.zip'
          $extract = Join-Path $tempRoot 'extract'
          try {
            New-Item -ItemType Directory -Path $extract | Out-Null
            Invoke-WebRequest -Uri $manifest.architecture.'64bit'.url -OutFile $archive -UseBasicParsing
            Expand-Archive -LiteralPath $archive -DestinationPath $extract
            $binary = Join-Path $extract 'aria2c.exe'
            if (-not (Test-Path -LiteralPath $binary)) { throw "Scoop archive does not contain aria2c.exe" }
            $versionOutput = (& $binary --version | Out-String)
            if ($versionOutput -notmatch [regex]::Escape($env:RELEASE_TAG.TrimStart('v'))) {
              throw "Scoop binary version does not match $env:RELEASE_TAG: $versionOutput"
            }
            Write-Host $versionOutput
          } finally {
            if (Test-Path -LiteralPath $tempRoot) { Remove-Item -LiteralPath $tempRoot -Recurse -Force }
          }
      - name: Commit manifest update
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scoop/aria2-rust.json
          if (git diff --cached --quiet) {
            Write-Host "Scoop manifest is already up to date."
            exit 0
          }
          git commit -m "chore: update Scoop manifest for $env:RELEASE_TAG"
          git push origin "HEAD:$env:DEFAULT_BRANCH"
