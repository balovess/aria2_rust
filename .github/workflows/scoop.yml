name: Update Scoop manifest

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: package-manifests
  cancel-in-progress: false

jobs:
  update:
    name: Update Scoop manifest
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Update and validate manifest
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          ./scripts/update-scoop.ps1 -Version $env:RELEASE_TAG -Repository $env:REPOSITORY
          ./scripts/update-scoop.ps1 -Check
      - name: Commit manifest update
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/aria2-rust.json
          if (git diff --cached --quiet) {
            Write-Host "Scoop manifest is already up to date."
            exit 0
          }
          git commit -m "chore: update Scoop manifest for $env:RELEASE_TAG"
          git push origin "HEAD:$env:DEFAULT_BRANCH"

  upgrade-test:
    name: Install and update Scoop bucket
    needs: update
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Install from bucket and verify update path
        shell: pwsh
        env:
          BUCKET_REPOSITORY: https://github.com/${{ github.repository }}.git
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          scoop bucket add aria2 $env:BUCKET_REPOSITORY
          scoop install aria2/aria2-rust
          scoop update
          scoop update aria2-rust
          $versionOutput = (& aria2c --version | Out-String)
          if ($versionOutput -notmatch [regex]::Escape($env:RELEASE_TAG.TrimStart('v'))) {
            throw "Scoop installation version does not match $env:RELEASE_TAG: $versionOutput"
          }
          Write-Host $versionOutput
