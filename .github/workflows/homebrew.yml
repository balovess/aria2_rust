name: Update Homebrew formula

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to update, for example v0.3.6
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Update and validate formula
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          ./scripts/update-homebrew.ps1 -Version $env:RELEASE_TAG -Repository $env:REPOSITORY
          ./scripts/update-homebrew.ps1 -Check
      - name: Commit formula update
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add homebrew/aria2-rust.rb
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "chore: update Homebrew formula for $env:RELEASE_TAG"
          git push origin "HEAD:$env:DEFAULT_BRANCH"
