[package]
name = "aria2-rpc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "RPC server for aria2-rust with JSON-RPC 2.0, XML-RPC, and WebSocket support"
documentation = "https://docs.rs/aria2-rpc"
homepage = "https://github.com/balovess/aria2-rust"
readme = "../README.md"
keywords = ["rpc", "json-rpc", "xml-rpc", "websocket", "aria2"]
categories = ["network-programming", "web-programming"]
include = ["src/**/*", "../README.md", "../LICENSE"]

[dependencies]
aria2-core.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
bytes.workspace = true
async-trait.workspace = true

axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
tungstenite = "0.20"
base64 = "0.21"
quick-xml = "0.31"
rand = "0.8"

# TLS/HTTPS support
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2.1"

[dev-dependencies]
tempfile = "3.8"
criterion.workspace = true

[[bench]]
name = "rpc_bench"
harness = false
