[package]
name = "aria2-rpc"
version = "0.2.4"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Remote control server for aria2-rust: JSON-RPC 2.0, XML-RPC, and WebSocket download management with 34+ methods and 7 event types"
documentation = "https://docs.rs/aria2-rpc"
homepage = "https://github.com/balovess/aria2_rust/"
readme = "../README.md"
keywords = ["rpc", "json-rpc", "xml-rpc", "websocket", "download-manager"]
categories = ["network-programming", "web-programming::http-server"]
include = ["src/**/*", "../README.md", "../LICENSE"]

[dependencies]
aria2-core.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
bytes.workspace = true
async-trait.workspace = true

axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
tungstenite = "0.20"
base64 = "0.21"
quick-xml = "0.31"
rand = "0.8"

# TLS/HTTPS support (use ring instead of aws-lc-rs to avoid STATUS_STACK_BUFFER_OVERRUN on Windows)
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2.1"

[dev-dependencies]
tempfile = "3.8"
criterion.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_ProcessStatus", "Win32_Foundation", "Win32_System_Threading"] }

[[bench]]
name = "rpc_bench"
harness = false
