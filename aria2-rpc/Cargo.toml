[package]
name = "aria2-rpc"
version = "0.3.4"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Remote control server for aria2-rust: aria2-compatible JSON-RPC 2.0, XML-RPC, and WebSocket download management"
documentation = "https://docs.rs/aria2-rpc"
homepage = "https://github.com/balovess/aria2_rust/"
readme = "../README.md"
keywords = ["rpc", "json-rpc", "xml-rpc", "websocket", "download-manager"]
categories = ["network-programming", "web-programming::http-server"]
include = ["src/**/*", "../README.md", "../LICENSE"]

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
bytes.workspace = true
async-trait.workspace = true

axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
tungstenite = "0.20"
base64.workspace = true
quick-xml = "0.31"
url = "2.5"
rand.workspace = true
hmac.workspace = true
sha2.workspace = true

# TLS/HTTPS support (use ring instead of aws-lc-rs to avoid STATUS_STACK_BUFFER_OVERRUN on Windows)
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { workspace = true, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile.workspace = true
# Low-level hyper server used to serve axum over TLS streams (axum::serve
# only accepts plain TCP; wrapping with tokio-rustls requires hyper directly).
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
tower-service = "0.3"

[dev-dependencies]
reqwest = { workspace = true, features = ["json", "rustls-no-provider"] }
tokio-tungstenite.workspace = true
futures.workspace = true
tempfile.workspace = true
criterion.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_ProcessStatus", "Win32_Foundation", "Win32_System_Threading"] }

[features]
default = []
# The binary crate enables protocol feature names on all of its dependencies.
# RPC is protocol-agnostic, so these are compatibility feature names only.
bittorrent = []
metalink = []
sftp = []

[[bench]]
name = "rpc_bench"
harness = false
