[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Aria2_rust"
version = "0.3.2"
description = "Python SDK for aria2-rust JSON-RPC interface"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.25",
    "websockets>=12.0",
    "typing_extensions>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["aria2_rust_client"]
