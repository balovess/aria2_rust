[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aria2-rust"
version = "0.3.9"
description = "Python SDK for aria2-rust JSON-RPC interface"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "aria2-rust contributors" }]
dependencies = [
    "httpx>=0.25",
    "websockets>=12.0",
    "typing_extensions>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["aria2_rust_client"]
