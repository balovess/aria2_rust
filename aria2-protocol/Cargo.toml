[package]
name = "aria2-protocol"
version = "0.2.3"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Multi-protocol networking stack for aria2-rust: HTTP/HTTPS client, FTP/SFTP, full BitTorrent (DHT/PEX/MSE), and Metalink V3/V4 parser"
documentation = "https://docs.rs/aria2-protocol"
homepage = "https://github.com/balovess/aria2_rust/"
readme = "../README.md"
keywords = ["http", "ftp", "bittorrent", "metalink", "dht"]
categories = ["network-programming", "web-programming::http-client"]
include = ["src/**/*", "../README.md", "../LICENSE"]

[dependencies]
tokio.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
bytes.workspace = true
async-trait.workspace = true

reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "gzip", "brotli", "socks", "http2"] }
# hyper dependency removed: aria2-protocol does not use hyper directly (verified
# via `rg "hyper::" aria2-protocol/src/` — zero matches). reqwest 0.13.4 brings
# in hyper 1.x transitively, so no direct hyper dependency is needed here.
rustls = "0.21"
rustls-pemfile = "1.0"
quick-xml = "0.31"

flate2 = "1.0"
base64 = "0.21"
base32 = "0.5"
url = "2.5"
md5 = "0.7"
sha1 = "0.10"
sha2 = "0.10"
digest = "0.10"
hex = "0.4"
rand = "0.8"
num-bigint-dig = "0.8"
num-traits = "0.2"
getrandom = "0.2"
russh = { version = "0.59", features = ["ring"] }
aws-lc-rs = { version = "1", features = ["prebuilt-nasm"] }
bitflags = "2.4"
dirs = "5"

[features]
default = []
http = []
bittorrent = []
metalink = []
sftp = []

[dev-dependencies]
tempfile = "3.8"
mockito = "1.4"
criterion.workspace = true

[[bench]]
name = "protocol_bench"
harness = false

[[bench]]
name = "bitfield_bench"
harness = false

[[bench]]
name = "sequential_picker_bench"
harness = false
