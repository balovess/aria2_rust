[package]
name = "aria2-protocol"
version = "0.3.10"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Multi-protocol networking stack for aria2-rust: HTTP/HTTPS client, FTP/SFTP, full BitTorrent (DHT/PEX/MSE), and Metalink V3/V4 parser"
documentation = "https://docs.rs/aria2-protocol"
homepage = "https://github.com/balovess/aria2_rust/"
readme = "../README.md"
keywords = ["http", "ftp", "bittorrent", "metalink", "dht"]
categories = ["network-programming", "web-programming::http-client"]
include = ["src/**/*", "../README.md", "../LICENSE"]

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
bytes.workspace = true
async-trait.workspace = true

# Use rustls-no-provider to avoid pulling in aws-lc-rs (STATUS_STACK_BUFFER_OVERRUN on Windows).
# ring is available via direct dependencies, so rustls auto-selects it.
reqwest = { workspace = true, default-features = false, features = ["rustls-no-provider", "gzip", "http2", "stream"] }
# rustls with ring — used to self-install the crypto provider so that
# reqwest (built with rustls-no-provider) can build clients independently
# of aria2-core.
rustls = { workspace = true, features = ["ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = { workspace = true }
webpki-roots = "1.0"

flate2 = "1.1"
base64.workspace = true
url = "2.5"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
ed25519-dalek = "3.0"
digest = "0.11"
hex.workspace = true
rand.workspace = true
getrandom = "0.4"
bitflags = "2.13"

# ── BitTorrent-only dependencies ──────────────────────────────────────
num-bigint-dig = { version = "0.9", optional = true }
num-traits = { version = "0.2", optional = true }

# ── SFTP-only dependencies ────────────────────────────────────────────
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"], optional = true }
dirs = { version = "7", optional = true }

# ── Metalink-only dependencies ────────────────────────────────────────
quick-xml = { version = "0.42", optional = true }

# ── Shared between bittorrent (magnet Base32) ────────────────────────
base32 = { version = "0.5", optional = true }

# ── SOCKS proxy support (optional, adds ~200KB) ──────────────────────
# Disabled by default; enable via the "socks" feature if needed.
# reqwest's socks feature pulls in the tokio-socks crate.

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_IO"] }

[features]
default = []
http = []
bittorrent = ["dep:num-bigint-dig", "dep:num-traits", "dep:base32"]
metalink = ["dep:quick-xml"]
sftp = ["dep:russh", "dep:dirs"]

[dev-dependencies]
tempfile.workspace = true
mockito = "1.7"
criterion.workspace = true

[[bench]]
name = "protocol_bench"
harness = false
required-features = ["bittorrent"]

[[bench]]
name = "bitfield_bench"
harness = false
required-features = ["bittorrent"]
