[package]
name = "aria2-protocol"
version = "0.2.4"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Multi-protocol networking stack for aria2-rust: HTTP/HTTPS client, FTP/SFTP, full BitTorrent (DHT/PEX/MSE), and Metalink V3/V4 parser"
documentation = "https://docs.rs/aria2-protocol"
homepage = "https://github.com/balovess/aria2_rust/"
readme = "../README.md"
keywords = ["http", "ftp", "bittorrent", "metalink", "dht"]
categories = ["network-programming", "web-programming::http-client"]
include = ["src/**/*", "../README.md", "../LICENSE"]

[dependencies]
tokio.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
bytes.workspace = true
async-trait.workspace = true

# Use rustls-no-provider to avoid pulling in aws-lc-rs (STATUS_STACK_BUFFER_OVERRUN on Windows).
# ring is available via direct dependencies, so rustls auto-selects it.
# (rustls and rustls-pemfile removed: not used directly in protocol source code.
#  The reqwest rustls-no-provider feature uses ring from aria2-core's crypto setup.)
reqwest = { workspace = true, default-features = false, features = ["rustls-no-provider", "gzip", "brotli", "socks", "http2"] }
quick-xml = "0.31"

flate2 = "1.0"
base64.workspace = true
base32 = "0.5"
url = "2.5"
md5 = "0.7"
sha1 = "0.10"
sha2 = "0.10"
digest = "0.10"
hex.workspace = true
rand.workspace = true
num-bigint-dig = "0.8"
num-traits = "0.2"
getrandom = "0.2"
russh = { version = "0.59", default-features = false, features = ["ring", "rsa"] }
bitflags = "2.4"
dirs = "5"

[features]
default = []
http = []
bittorrent = []
metalink = []
sftp = []

[dev-dependencies]
tempfile.workspace = true
mockito = "1.4"
criterion.workspace = true

[[bench]]
name = "protocol_bench"
harness = false

[[bench]]
name = "bitfield_bench"
harness = false

[[bench]]
name = "sequential_picker_bench"
harness = false
